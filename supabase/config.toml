# Supabase CLI / GitHub 연동 설정
# 문서: https://supabase.com/docs/guides/local-development/cli/config
project_id = "hanalife-general-affair"

[api]
enabled = true
port = 54321
# 화면(REST API)에서 사용할 스키마 — 원격 프로젝트는 Dashboard → Settings → API → Exposed schemas 에도 같은 목록을 추가하세요.
schemas = ["public", "graphql_public", "core", "ga", "vehicle", "meeting", "seal"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# 원격 프로젝트의 PostgreSQL 주 버전과 맞춥니다 (Dashboard → Settings → Infrastructure 에서 확인).
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# 기준 데이터(부서·회의실·차량·인장 종류)는 마이그레이션에 포함되어 있어 별도 seed 파일을 쓰지 않습니다.
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
